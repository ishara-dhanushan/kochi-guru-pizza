name: CI Checks

on:
  push:
    branches:
      - "main"
      - "develop"
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  frontend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm clean-install

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Run integration tests with coverage
        run: npm run test:integration:coverage

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Audit dependencies
        run: npm audit
        continue-on-error: true

  backend-check:
    runs-on: ubuntu-latest

    # Prevent overlapping workflow runs from using the shared test database.
    # Within this job Jest can still use three integration workers.
    concurrency:
      group: kochi-backend-test-database
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./backend/package-lock.json"

      - name: Install dependencies
        run: npm clean-install

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Build Express app
        run: npm run build

      - name: Type-check backend tests
        run: npm run test:typecheck

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Run integration tests with coverage
        run: npm run test:integration:coverage
        env:
          MONGO_DB_URI_TEST: ${{ secrets.MONGO_DB_URI_TEST }}

      - name: Audit dependencies
        run: npm audit
        continue-on-error: true

  e2e-check:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Serialize E2E jobs that share the same Atlas database.
    # The three Playwright workers can still execute concurrently.
    concurrency:
      group: kochi-e2e-test-database
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ./tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ./frontend/package-lock.json
            ./backend/package-lock.json
            ./tests/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm clean-install

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm clean-install

      - name: Install E2E dependencies
        run: npm clean-install

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Check E2E formatting
        run: npm run format:check

      - name: Type-check E2E tests
        run: npm run typecheck

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          MONGO_DB_URI_E2E: ${{ secrets.MONGO_DB_URI_E2E }}
