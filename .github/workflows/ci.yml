name: CI Checks

on:
  push:
    branches:
      - "main"
      - "develop"
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm clean-install

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Audit dependencies
        run: npm audit
        continue-on-error: true

  backend-check:
    runs-on: ubuntu-latest

    # Prevent overlapping workflow runs from using the shared test database.
    # Within this job Jest can still use three integration workers.
    concurrency:
      group: kochi-backend-test-database
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./backend/package-lock.json"

      - name: Install dependencies
        run: npm clean-install

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Build Express app
        run: npm run build

      - name: Type-check backend tests
        run: npm run test:typecheck

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Run integration tests with coverage
        run: npm run test:integration:coverage
        env:
          # No dummy Google/R2/JWT environment variables.
          # The order suite mocks provider dependencies and test config locally.
          MONGO_DB_URI_TEST: ${{ secrets.MONGO_DB_URI_TEST }}

      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: backend/coverage/unit/
          if-no-files-found: ignore

      - name: Upload integration coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-coverage
          path: backend/coverage/integration/
          if-no-files-found: ignore

      - name: Audit dependencies
        run: npm audit
        continue-on-error: true
